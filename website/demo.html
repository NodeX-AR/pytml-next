<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pytml 3 demo</title><script src="../pytml.js"></script><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:20px}section{border:1px solid #ddd;padding:20px;border-radius:14px}input,button{padding:10px;margin:5px}#result{font-size:22px}.joystick{margin-top:20px}</style></head><body>
<h1>Pytml 3 demo</h1><section>
<input id="name" placeholder="Your name"><button id="hello">Say hello</button><p id="result"></p>
<joystick1 id="stick"></joystick1>
<pre id="debug"></pre>
<py1>
def greet():
    result.text = "Hello " + name.value
hello.on("click", greet)

def move(e):
    debug.text = f"joystick x={e['joystick_x']} y={e['joystick_y']} magnitude={e['magnitude']}"
stick.on("pytmljoystick", move)
</py1>
</section></body></html>
